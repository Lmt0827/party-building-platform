<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忘记密码 - 党建数字化平台</title>
<link rel="stylesheet" href="login.css">
<style>
  .page-title {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    color: #1a2d4a;
    margin-bottom: 24px;
    letter-spacing: 2px;
  }
  .code-group {
    display: flex;
    gap: 12px;
  }
  .code-group .form-group {
    flex: 1;
    margin-bottom: 0;
  }
  .code-btn {
    width: 110px;
    height: 46px;
    border: 1.5px solid #c9302c;
    border-radius: 8px;
    background: #fff;
    color: #c9302c;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
  }
  .code-btn:hover {
    background: #c9302c;
    color: #fff;
  }
  .code-btn:disabled {
    border-color: #b8c5d6;
    color: #b8c5d6;
    background: #f5f7fa;
    cursor: not-allowed;
  }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #6b7c93;
    text-decoration: none;
    transition: color 0.3s ease;
  }
  .back-link:hover {
    color: #c9302c;
    text-decoration: underline;
  }
  .form-rule-hint {
    font-size: 11px;
    color: #a0aec0;
    margin-top: 4px;
    padding-left: 2px;
  }
</style>
</head>
<body>
<div class="login-bg">
  <div class="grid-overlay"></div>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="particles">
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>
    <div class="particle p7"></div>
    <div class="particle p8"></div>
  </div>
  <div class="ribbon-decor">
    <div class="ribbon-line"></div>
    <div class="ribbon-line"></div>
  </div>
  <div class="city-silhouette">
    <div class="mountain-layer mountain-1"></div>
    <div class="mountain-layer mountain-2"></div>
    <div class="city-buildings"></div>
  </div>

  <div class="hero-text">
    <div class="hero-title">党建数字化平台</div>
    <div class="hero-divider"></div>
    <div class="hero-subtitle">以数字化赋能基层党建<br>打造智慧党建管理新范式</div>
    <div class="hero-features">
      <div class="hero-feature"><span class="hero-feature-dot"></span><span>组织管理 · 党员教育 · 党建活动一体化</span></div>
      <div class="hero-feature"><span class="hero-feature-dot"></span><span>数据驱动 · 智能分析 · 科学决策</span></div>
      <div class="hero-feature"><span class="hero-feature-dot"></span><span>安全可靠 · 高效便捷 · 服务群众</span></div>
    </div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="logo-section">
        <div class="party-emblem">党</div>
        <div class="platform-name">党建数字化平台</div>
        <div class="platform-subtitle">高新区智慧党建管理系统</div>
      </div>

      <div class="page-title">忘记密码</div>

      <div class="form-group">
        <input type="text" id="fp-account" placeholder="请输入账号" autocomplete="username">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>

      <div class="form-group">
        <input type="tel" id="fp-phone" placeholder="请输入手机号码" maxlength="11">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
      </div>

      <div class="form-group code-group" style="margin-bottom: 20px;">
        <div class="form-group">
          <input type="text" id="fp-sms" placeholder="请输入短信验证码" maxlength="6">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 12l2 2 4-4"></path>
            <path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9c2.5 0 4.77 1.02 6.41 2.67"></path>
          </svg>
        </div>
        <button class="code-btn" id="fp-send-btn" onclick="sendCode(this)">获取验证码</button>
      </div>

      <div class="form-group">
        <input type="password" id="fp-new-pwd" placeholder="请输入新密码" autocomplete="new-password">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span class="toggle-password" onclick="togglePassword('fp-new-pwd', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </span>
      </div>

      <div class="form-group">
        <input type="password" id="fp-confirm-pwd" placeholder="请再次确认新密码" autocomplete="new-password">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span class="toggle-password" onclick="togglePassword('fp-confirm-pwd', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </span>
      </div>

      <button class="login-btn" style="margin-top: 8px;" onclick="resetPassword()">重 置 密 码</button>
      <a href="login.html" class="back-link">返回登录</a>
    </div>
  </div>

  <div class="copyright">
    Copyright © 2024 高新区智慧党建管理系统 版权所有 | 技术支持：数字化转型办公室
  </div>
</div>

<script>
  function togglePassword(inputId, iconEl) {
    var input = document.getElementById(inputId);
    if (input.type === 'password') {
      input.type = 'text';
      iconEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
    } else {
      input.type = 'password';
      iconEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    }
  }

  function sendCode(btn) {
    var phone = document.getElementById('fp-phone').value;
    if (!/^1\d{10}$/.test(phone)) {
      alert('请输入正确的手机号码');
      return;
    }
    var seconds = 60;
    btn.disabled = true;
    btn.textContent = seconds + 's';
    var timer = setInterval(function() {
      seconds--;
      if (seconds <= 0) {
        clearInterval(timer);
        btn.disabled = false;
        btn.textContent = '获取验证码';
      } else {
        btn.textContent = seconds + 's';
      }
    }, 1000);
    alert('验证码已发送：123456（演示）');
  }

  function resetPassword() {
    var account = document.getElementById('fp-account').value;
    var phone = document.getElementById('fp-phone').value;
    var sms = document.getElementById('fp-sms').value;
    var pwd = document.getElementById('fp-new-pwd').value;
    var confirm = document.getElementById('fp-confirm-pwd').value;

    if (!account) { alert('请输入账号'); return; }
    if (!/^1\d{10}$/.test(phone)) { alert('请输入正确的手机号码'); return; }
    if (!sms) { alert('请输入短信验证码'); return; }
    if (!pwd) { alert('请输入新密码'); return; }
    if (pwd !== confirm) { alert('两次输入的密码不一致'); return; }

    var btn = event.target;
    btn.textContent = '重置中...';
    btn.style.opacity = '0.8';
    btn.disabled = true;
    setTimeout(function() {
      btn.textContent = '重 置 密 码';
      btn.style.opacity = '1';
      btn.disabled = false;
      alert('密码重置成功，请返回登录');
    }, 1500);
  }
</script>
</body>
</html>
