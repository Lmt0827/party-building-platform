<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>短信登录 - 党建数字化平台</title>
<link rel="stylesheet" href="login.css">
<style>
  .page-title {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    color: #1a2d4a;
    margin-bottom: 24px;
    letter-spacing: 2px;
  }
  .code-group {
    display: flex;
    gap: 12px;
  }
  .code-group .form-group {
    flex: 1;
    margin-bottom: 0;
  }
  .code-btn {
    width: 110px;
    height: 46px;
    border: 1.5px solid #c9302c;
    border-radius: 8px;
    background: #fff;
    color: #c9302c;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
  }
  .code-btn:hover {
    background: #c9302c;
    color: #fff;
  }
  .code-btn:disabled {
    border-color: #b8c5d6;
    color: #b8c5d6;
    background: #f5f7fa;
    cursor: not-allowed;
  }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #6b7c93;
    text-decoration: none;
    transition: color 0.3s ease;
  }
  .back-link:hover {
    color: #c9302c;
    text-decoration: underline;
  }
  .form-rule-hint {
    font-size: 11px;
    color: #a0aec0;
    margin-top: 4px;
    padding-left: 2px;
  }
</style>
</head>
<body>
<div class="login-bg">
  <div class="grid-overlay"></div>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="particles">
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>
    <div class="particle p7"></div>
    <div class="particle p8"></div>
  </div>
  <div class="ribbon-decor">
    <div class="ribbon-line"></div>
    <div class="ribbon-line"></div>
  </div>
  <div class="city-silhouette">
    <div class="mountain-layer mountain-1"></div>
    <div class="mountain-layer mountain-2"></div>
    <div class="city-buildings"></div>
  </div>

  <div class="hero-text">
    <div class="hero-title">党建数字化平台</div>
    <div class="hero-divider"></div>
    <div class="hero-subtitle">以数字化赋能基层党建<br>打造智慧党建管理新范式</div>
    <div class="hero-features">
      <div class="hero-feature"><span class="hero-feature-dot"></span><span>组织管理 · 党员教育 · 党建活动一体化</span></div>
      <div class="hero-feature"><span class="hero-feature-dot"></span><span>数据驱动 · 智能分析 · 科学决策</span></div>
      <div class="hero-feature"><span class="hero-feature-dot"></span><span>安全可靠 · 高效便捷 · 服务群众</span></div>
    </div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="logo-section">
        <div class="party-emblem">党</div>
        <div class="platform-name">党建数字化平台</div>
        <div class="platform-subtitle">高新区智慧党建管理系统</div>
      </div>

      <div class="page-title">短信登录</div>

      <div class="form-group">
        <input type="tel" id="sms-phone" placeholder="请输入手机号码" maxlength="11">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
      </div>

      <div class="form-group code-group" style="margin-bottom: 20px;">
        <div class="form-group">
          <input type="text" id="sms-code" placeholder="请输入短信验证码" maxlength="6">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 12l2 2 4-4"></path>
            <path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9c2.5 0 4.77 1.02 6.41 2.67"></path>
          </svg>
        </div>
        <button class="code-btn" id="sms-send-btn" onclick="sendCode(this)">获取验证码</button>
      </div>

      <button class="login-btn" style="margin-top: 8px;" onclick="handleSmsLogin()">登 录</button>
      <a href="login.html" class="back-link">返回账号密码登录</a>
    </div>
  </div>

  <div class="copyright">
    Copyright © 2024 高新区智慧党建管理系统 版权所有 | 技术支持：数字化转型办公室
  </div>
</div>

<script>
  function sendCode(btn) {
    var phone = document.getElementById('sms-phone').value;
    if (!/^1\d{10}$/.test(phone)) {
      alert('请输入正确的手机号码');
      return;
    }
    var seconds = 60;
    btn.disabled = true;
    btn.textContent = seconds + 's';
    var timer = setInterval(function() {
      seconds--;
      if (seconds <= 0) {
        clearInterval(timer);
        btn.disabled = false;
        btn.textContent = '获取验证码';
      } else {
        btn.textContent = seconds + 's';
      }
    }, 1000);
    alert('验证码已发送：123456（演示）');
  }

  function handleSmsLogin() {
    var phone = document.getElementById('sms-phone').value;
    var code = document.getElementById('sms-code').value;

    if (!/^1\d{10}$/.test(phone)) {
      alert('请输入正确的手机号码');
      return;
    }
    if (!code) {
      alert('请输入短信验证码');
      return;
    }

    var btn = event.target;
    var originalText = btn.textContent;
    btn.textContent = '登录中...';
    btn.style.opacity = '0.8';
    btn.disabled = true;
    setTimeout(function() {
      btn.textContent = originalText;
      btn.style.opacity = '1';
      btn.disabled = false;
      alert('登录成功！（演示）');
    }, 1500);
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleSmsLogin();
  });
</script>
</body>
</html>
