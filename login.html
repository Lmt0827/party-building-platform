<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>党建数字化平台 - 登录</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="login-bg">
  <!-- 网格线 -->
  <div class="grid-overlay"></div>

  <!-- 光晕 -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <!-- 金色粒子 -->
  <div class="particles">
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>
    <div class="particle p7"></div>
    <div class="particle p8"></div>
  </div>

  <!-- 红色飘带装饰 -->
  <div class="ribbon-decor">
    <div class="ribbon-line"></div>
    <div class="ribbon-line"></div>
  </div>

  <!-- 底部山水城市剪影 -->
  <div class="city-silhouette">
    <div class="mountain-layer mountain-1"></div>
    <div class="mountain-layer mountain-2"></div>
    <div class="city-buildings"></div>
  </div>

  <!-- 左侧标语区 -->
  <div class="hero-text">
    <div class="hero-title">党建数字化平台</div>
    <div class="hero-divider"></div>
    <div class="hero-subtitle">以数字化赋能基层党建<br>打造智慧党建管理新范式</div>
    <div class="hero-features">
      <div class="hero-feature">
        <span class="hero-feature-dot"></span>
        <span>组织管理 · 党员教育 · 党建活动一体化</span>
      </div>
      <div class="hero-feature">
        <span class="hero-feature-dot"></span>
        <span>数据驱动 · 智能分析 · 科学决策</span>
      </div>
      <div class="hero-feature">
        <span class="hero-feature-dot"></span>
        <span>安全可靠 · 高效便捷 · 服务群众</span>
      </div>
    </div>
  </div>

  <!-- 登录卡片 -->
  <div class="login-container">
    <div class="login-card">
      <!-- Logo 区域 -->
      <div class="logo-section">
        <div class="party-emblem">党</div>
        <div class="platform-name">党建数字化平台</div>
        <div class="platform-subtitle">高新区智慧党建管理系统</div>
      </div>

      <!-- Tab 切换 -->
      <div class="tab-nav">
        <div class="tab-item active" data-tab="operator">运营登录</div>
        <div class="tab-item" data-tab="enterprise">企业登录</div>
      </div>

      <!-- 运营登录表单 -->
      <div class="form-panel active" id="operator-panel">
        <div class="form-group">
          <input type="text" id="op-account" placeholder="请输入账号" autocomplete="username">
                <div class="form-rule-hint">必填；4–20 个字符</div>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>

        <div class="form-group">
          <input type="password" id="op-password" placeholder="请输入密码" autocomplete="current-password">
                <div class="form-rule-hint">必填；6–20 个字符</div>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span class="toggle-password" onclick="togglePassword('op-password', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </span>
        </div>

        <div class="captcha-group">
          <div class="form-group">
            <input type="text" id="op-captcha" placeholder="请输入验证码" maxlength="4">
                <div class="form-rule-hint">必填；4 位数字或字母</div>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 12l2 2 4-4"></path>
              <path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9c2.5 0 4.77 1.02 6.41 2.67"></path>
            </svg>
          </div>
          <div class="captcha-image" onclick="refreshCaptcha(this)">
            <span id="op-captcha-text">A3K9</span>
          </div>
        </div>

        <div class="form-options" style="margin-top: 20px;">
          <label class="remember-me">
            <input type="checkbox"> 记住我
          </label>
          <a href="forgot_password.html" class="forgot-password">忘记密码？</a>
        </div>

        <button class="login-btn" onclick="handleLogin('operator')">登 录</button>
      </div>

      <!-- 企业登录表单 -->
      <div class="form-panel" id="enterprise-panel">
        <div class="form-group enterprise-select">
          <select id="ent-select">
            <option value="">请选择企业</option>
            <option value="1">高新技术产业开发区投资集团有限公司</option>
            <option value="2">科技创新发展股份有限公司</option>
            <option value="3">智慧城市建设运营有限公司</option>
            <option value="4">数字经济产业发展有限公司</option>
            <option value="5">园区服务管理集团有限公司</option>
          </select>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 21h18"></path>
            <path d="M5 21V7l8-4v18"></path>
            <path d="M19 21V11l-6-4"></path>
            <path d="M9 9v.01"></path>
            <path d="M9 13v.01"></path>
            <path d="M9 17v.01"></path>
          </svg>
          <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>

        <div class="form-group">
          <input type="text" id="ent-account" placeholder="请输入账号" autocomplete="username">
                <div class="form-rule-hint">必填；4–20 个字符</div>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>

        <div class="form-group">
          <input type="password" id="ent-password" placeholder="请输入密码" autocomplete="current-password">
                <div class="form-rule-hint">必填；6–20 个字符</div>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span class="toggle-password" onclick="togglePassword('ent-password', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </span>
        </div>

        <div class="captcha-group">
          <div class="form-group">
            <input type="text" id="ent-captcha" placeholder="请输入验证码" maxlength="4">
                <div class="form-rule-hint">必填；4 位数字或字母</div>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 12l2 2 4-4"></path>
              <path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9c2.5 0 4.77 1.02 6.41 2.67"></path>
            </svg>
          </div>
          <div class="captcha-image" onclick="refreshCaptcha(this)">
            <span id="ent-captcha-text">X7B2</span>
          </div>
        </div>

        <div class="form-options" style="margin-top: 20px;">
          <label class="remember-me">
            <input type="checkbox"> 记住我
          </label>
          <a href="forgot_password.html" class="forgot-password">忘记密码？</a>
        </div>

        <button class="login-btn" onclick="handleLogin('enterprise')">登 录</button>
      </div>

      <!-- 其他登录方式 -->
      <div class="other-login">
        <div class="other-login-title">其他登录方式</div>
        <div class="other-login-icons">
          <a href="sms_login.html" class="login-icon-item">
            <div class="icon-circle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
              </svg>
            </div>
            <span>短信登录</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- 版权信息 -->
  <div class="copyright">
    Copyright © 2024 高新区智慧党建管理系统 版权所有 | 技术支持：数字化转型办公室
  </div>
</div>

<script>
  // Tab 切换
  document.querySelectorAll('.tab-item').forEach(function(tab) {
    tab.addEventListener('click', function() {
      var tabName = this.getAttribute('data-tab');

      // 切换 tab 样式
      document.querySelectorAll('.tab-item').forEach(function(t) {
        t.classList.remove('active');
      });
      this.classList.add('active');

      // 切换面板
      document.querySelectorAll('.form-panel').forEach(function(panel) {
        panel.classList.remove('active');
      });
      document.getElementById(tabName + '-panel').classList.add('active');
    });
  });

  // 密码可见性切换
  function togglePassword(inputId, iconEl) {
    var input = document.getElementById(inputId);
    if (input.type === 'password') {
      input.type = 'text';
      iconEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
    } else {
      input.type = 'password';
      iconEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    }
  }

  // 刷新验证码
  function refreshCaptcha(el) {
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    var code = '';
    for (var i = 0; i < 4; i++) {
      code += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    var span = el.querySelector('span');
    span.textContent = code;

    // 简单的旋转动画
    el.style.transform = 'scale(0.95)';
    setTimeout(function() {
      el.style.transform = 'scale(1)';
    }, 150);
  }

  // 登录处理
  function handleLogin(type) {
    var account, password, captcha;

    if (type === 'operator') {
      account = document.getElementById('op-account').value;
      password = document.getElementById('op-password').value;
      captcha = document.getElementById('op-captcha').value;
    } else {
      var entSelect = document.getElementById('ent-select').value;
      account = document.getElementById('ent-account').value;
      password = document.getElementById('ent-password').value;
      captcha = document.getElementById('ent-captcha').value;

      if (!entSelect) {
        alert('请选择企业');
        return;
      }
    }

    if (!account) {
      alert('请输入账号');
      return;
    }
    if (!password) {
      alert('请输入密码');
      return;
    }
    if (!captcha) {
      alert('请输入验证码');
      return;
    }

    // 模拟登录
    var btn = event.target;
    var originalText = btn.textContent;
    btn.textContent = '登录中...';
    btn.style.opacity = '0.8';
    btn.disabled = true;

    setTimeout(function() {
      btn.textContent = originalText;
      btn.style.opacity = '1';
      btn.disabled = false;
      alert('登录成功！（演示）');
    }, 1500);
  }

  // 回车键登录
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      var activeTab = document.querySelector('.tab-item.active').getAttribute('data-tab');
      handleLogin(activeTab);
    }
  });
</script>
<script src="common.js"></script>
</body>
</html>
